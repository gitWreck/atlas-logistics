<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Atlas – Driver Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- 🔐 SECURITY HARDENING -->
<meta http-equiv="X-Frame-Options" content="DENY">

<style>
/* ===============================
   BASE
================================ */
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto;
  background: #f9fafb;
  margin: 0;
  padding: 24px;
  color: #0f172a;
}

main {
  max-width: 900px;
  margin: 0 auto;
}

/* ===============================
   LOGO
================================ */
.logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}

.logo-wrap img {
  width: 160px;
  max-width: 70%;
  height: auto;
}

/* ===============================
   HEADER
================================ */
h1 {
  font-size: 26px;
  letter-spacing: -0.4px;
  margin-bottom: 4px;
  text-align: center;
}

.sub {
  text-align: center;
  font-size: 13px;
  color: #64748b;
  margin-bottom: 28px;
}

/* ===============================
   GRID + CARDS
================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 6px 18px rgba(0,0,0,.05);
  transition: transform .15s ease, box-shadow .15s ease;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(0,0,0,.08);
}

.card div:first-child {
  font-size: 14px;
  color: #475569;
}

/* ===============================
   STATS
================================ */
.stat {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.6px;
  margin-top: 10px;
}

/* ===============================
   FOOTER ACTIONS
================================ */
.footer-actions {
  display: flex;
  justify-content: center;
}

.footer-actions button {
  padding: 14px 28px;
  border-radius: 999px;
  border: none;
  background: #2563eb;
  color: #ffffff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s ease, transform .1s ease, box-shadow .15s ease;
}

.footer-actions button:hover {
  background: #1e4fd8;
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(37,99,235,.35);
}

.footer-actions button:active {
  transform: translateY(0);
}

/* ===============================
   MOBILE TUNING
================================ */
@media (max-width: 480px) {
  h1 {
    font-size: 22px;
  }

  .stat {
    font-size: 30px;
  }

  .footer-actions button {
    width: 100%;
    max-width: 320px;
  }
}
</style>
</head>

<body>
<main>

<!-- ================= LOGO ================= -->
<div class="logo-wrap">
  <img src="../atlas-logo.png" alt="ATLAS Logo">
</div>

<!-- ================= HEADER ================= -->
<h1>Driver Dashboard</h1>
<div class="sub">Today’s deliveries</div>

<!-- ================= STATS ================= -->
<div class="grid">
  <div class="card">
    <div>🚚 Active Deliveries</div>
    <div class="stat" id="active">–</div>
  </div>
</div>

<!-- ================= ACTION ================= -->
<div class="footer-actions">
  <button onclick="location.href='/driver/shipments.html'">
    View Shipments
  </button>
</div>

</main>

<!-- ================= SCRIPT ================= -->
<script type="module" src="./dashboard.js"></script>

</body>
</html>
