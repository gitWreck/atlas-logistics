<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Atlas – Secure Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1e4fd8;
      --danger-bg: #fee2e2;
      --danger-text: #991b1b;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(135deg, #f4f6fb, #eef2ff);
      margin: 0;
      padding: 40px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #0f172a;
    }

    .card {
      background: var(--card);
      padding: 32px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,.12);
      text-align: center;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo-wrap img {
      width: 180px;
      max-width: 60%;
      height: auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
    }

    .sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 22px;
    }

    form { text-align: left; }

    label {
      font-size: 13px;
      color: #475569;
      display: block;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s ease, transform .1s ease;
    }

    button:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0px);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error {
      margin-top: 14px;
      padding: 10px;
      border-radius: 10px;
      background: var(--danger-bg);
      color: var(--danger-text);
      font-size: 13px;
      display: none;
      line-height: 1.35;
    }

    .error.active { display: block; }

    .note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }

    /* ✅ Honeypot field is visually hidden but still in DOM */
    .hp {
      position: absolute !important;
      left: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
    }

    @media (max-width: 480px) {
      body { padding: 20px; }
    }
  </style>
</head>

<body>

  <div class="card" role="region" aria-labelledby="loginTitle">
    <div class="logo-wrap">
      <img src="/atlas-logo.png" alt="ATLAS Logo">
    </div>

    <h1 id="loginTitle">Atlas Login</h1>
    <div class="sub">
      Secure access for Admins, Managers, Drivers, and Checkers
    </div>

    <form id="loginForm" novalidate>
      <!-- ✅ Honeypot (anti-bot) -->
      <label class="hp" for="username">Username</label>
      <input
        class="hp"
        id="username"
        name="username"
        type="text"
        autocomplete="off"
        tabindex="-1"
        aria-hidden="true"
      />

      <label for="emailInput">Email</label>
      <input
        id="emailInput"
        type="email"
        autocomplete="username"
        inputmode="email"
        autocapitalize="none"
        spellcheck="false"
        required
      />

      <label for="passwordInput">Password</label>
      <input
        id="passwordInput"
        type="password"
        autocomplete="current-password"
        autocapitalize="none"
        spellcheck="false"
        required
      />

      <button type="submit" id="loginBtn" aria-busy="false">
        Sign In
      </button>
    </form>

    <div
      class="error"
      id="loginError"
      role="alert"
      aria-live="assertive"
    ></div>

    <div class="note">
      All login attempts are monitored and audited.
    </div>
  </div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-functions.js"></script>

<!-- Atlas -->
<script src="/firebase.js"></script>
<script src="/auth.js"></script>



</body>
</html>
