<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Atlas – Manager Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- 🔐 SECURITY HARDENING -->
<meta http-equiv="X-Frame-Options" content="DENY">

<style>
/* ===============================
   BASE
================================ */
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto;
  background: #f9fafb;
  margin: 0;
  padding: 24px;
  color: #0f172a;
}

main {
  max-width: 1100px;
  margin: 0 auto;
}

/* ===============================
   LOGO
================================ */
.logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}

.logo-wrap img {
  width: 170px;
  max-width: 70%;
}

/* ===============================
   HEADER
================================ */
h1 {
  font-size: 28px;
  letter-spacing: -0.4px;
  margin-bottom: 4px;
  text-align: center;
}

.sub {
  text-align: center;
  font-size: 14px;
  color: #64748b;
  margin-bottom: 28px;
}

/* ===============================
   GRID + CARDS
================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}

.card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 6px 18px rgba(0,0,0,.05);
  transition: transform .15s ease, box-shadow .15s ease;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(0,0,0,.08);
}

.card div:first-child {
  font-size: 14px;
  color: #475569;
}

/* ===============================
   STATS
================================ */
.stat {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.6px;
  margin-top: 10px;
}

/* ===============================
   TABLE
================================ */
.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 520px;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #e5e7eb;
  text-align: left;
  font-size: 13px;
}

th {
  background: #f8fafc;
  font-weight: 700;
  position: sticky;
  top: 0;
}

.state {
  text-align: center;
  padding: 16px;
  color: #64748b;
}

/* ===============================
   FOOTER ACTIONS
================================ */
.footer-actions {
  display: flex;
  justify-content: center;
  margin-top: 28px;
}

.footer-actions button {
  padding: 14px 30px;
  border-radius: 999px;
  border: none;
  background: #2563eb;
  color: #ffffff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s ease, transform .1s ease, box-shadow .15s ease;
}

.footer-actions button:hover {
  background: #1e4fd8;
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(37,99,235,.35);
}

.footer-actions button:active {
  transform: translateY(0);
}

/* ===============================
   MOBILE TUNING
================================ */
@media (max-width: 480px) {
  h1 {
    font-size: 24px;
  }

  .stat {
    font-size: 30px;
  }

  .footer-actions button {
    width: 100%;
    max-width: 320px;
  }
}
</style>
</head>

<body>
<main>

<!-- ================= LOGO ================= -->
<div class="logo-wrap">
  <img src="../atlas-logo.png" alt="ATLAS Logo">
</div>

<!-- ================= HEADER ================= -->
<h1>Manager Dashboard</h1>
<div class="sub">Operational overview</div>

<!-- ================= STATS ================= -->
<div class="grid">
  <div class="card">
    <div>📦 Total Shipments</div>
    <div class="stat" id="totalShipments">–</div>
  </div>

  <div class="card">
    <div>⚠️ Delayed</div>
    <div class="stat" id="delayedShipments">–</div>
  </div>

  <div class="card">
    <div>🚚 In Transit</div>
    <div class="stat" id="inTransit">–</div>
  </div>
</div>

<!-- ================= RECENT SHIPMENTS ================= -->
<div class="card">
  <h2>Recent Shipments</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Tracking</th>
          <th>Status</th>
          <th>Route</th>
          <th>Updated</th>
        </tr>
      </thead>
      <tbody id="shipmentTable">
        <tr>
          <td colspan="4" class="state">Loading…</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ================= ACTION ================= -->
<div class="footer-actions">
  <button onclick="location.href='/manager/shipments.html'">
    Manage Shipments
  </button>
</div>

</main>

<!-- ================= SCRIPT ================= -->
<script type="module" src="./dashboard.js"></script>

</body>
</html>
