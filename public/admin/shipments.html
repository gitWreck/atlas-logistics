<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Shipments</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Global badge styles -->
  <link rel="stylesheet" href="../styles/badges.css" />

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto;
      background: #f9fafb;
      padding: 24px;
    }

    /* ================= HEADER ================= */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .logo {
      height: 36px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }

    /* ================= ANALYTICS ================= */
    #analytics {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      padding: 14px 18px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.06);
      font-size: 14px;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,.1);
    }

    .card.active {
      outline: 2px solid #2563eb;
    }

    .card strong {
      font-size: 20px;
      display: block;
    }

    /* ================= TABLE ================= */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,.06);
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: #f1f5f9;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    select, button {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    select {
      border: 1px solid #cbd5e1;
      background: #fff;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      border: none;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .admin-note {
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <!-- ================= ANALYTICS CARDS ================= -->
  <div id="analytics">
    <div class="card" id="stuckCount">
      <strong>0</strong>
      Stuck
    </div>
    <div class="card" id="delayedCount">
      <strong>0</strong>
      Delayed
    </div>
    <div class="card" id="inTransitCount">
      <strong>0</strong>
      In Transit
    </div>
  </div>

  <!-- ================= HEADER ================= -->
  <div class="header">
    <img src="../atlas-logo.png" class="logo" alt="Atlas Logo" />
    <h1>Admin – Shipments</h1>
  </div>

  <!-- ================= TABLE ================= -->
  <table>
    <thead>
      <tr>
        <th>Tracking</th>
        <th>Customer</th>
        <th>Status</th>
        <th>Last Update</th>
        <th>Admin Control</th>
      </tr>
    </thead>
    <tbody id="shipmentTable">
      <!-- Filled by shipments.js -->
    </tbody>
  </table>

  <!-- ================= SCRIPT ================= -->
  <script type="module" src="./shipments.js"></script>

</body>
</html>
