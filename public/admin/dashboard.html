<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Atlas Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* ===============================
   BASE
================================ */
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto;
  background: #f9fafb;
  margin: 0;
  padding: 40px;
}

h1 {
  font-size: 34px;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}

h2 {
  margin-top: 0;
  letter-spacing: -0.3px;
}

.sub {
  color: #555;
  margin-bottom: 30px;
}

/* ===============================
   LOGO
================================ */
.logo-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}

.logo-wrap img {
  width: 180px;
  max-width: 60%;
  height: auto;
}

/* ===============================
   GRID + CARDS
================================ */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,.05);
  transition: 
    box-shadow .2s ease,
    transform .2s ease,
    border-color .2s ease;
}

.card:hover {
  box-shadow: 0 14px 40px rgba(0,0,0,.08);
  transform: translateY(-2px);
  border-color: #d1d5db;
}

.card.analytics {
  background: #fcfcfd;
}

/* ===============================
   STATS
================================ */
.stat {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-top: 8px;
}

/* ===============================
   TABLES
================================ */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #eee;
  text-align: left;
}

th {
  background: #f8f9fc;
}

.card table {
  border-radius: 12px;
  overflow: hidden;
}

/* ===============================
   UI ELEMENTS
================================ */
select, button {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s ease, transform .1s ease;
}

button:hover {
  transform: translateY(-1px);
}

button:active {
  transform: translateY(0);
}

button.secondary {
  background: #6b7280;
}

/* ===============================
   BADGES
================================ */
.badge {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .3px;
}

.badge.green { background: #dcfce7; color: #166534; }
.badge.red   { background: #fee2e2; color: #991b1b; }
</style>
</head>

<body>

<!-- ================= LOGO ================= -->
<div class="logo-wrap">
  <img src="../atlas-logo.png" alt="ATLAS Logo">
</div>

<!-- ================= HEADER ================= -->
<h1>Admin Dashboard</h1>
<div class="sub" id="adminInfo">Loading admin…</div>

<!-- ================= CORE USER STATS ================= -->
<div class="grid">
  <div class="card">
    <div>👤 Users</div>
    <div class="stat" id="userCount">–</div>
  </div>

  <div class="card">
    <div>🟢 Active</div>
    <div class="stat" id="activeCount">–</div>
  </div>

  <div class="card">
    <div>🔴 Inactive</div>
    <div class="stat" id="inactiveCount">–</div>
  </div>
</div>

<!-- ================= ADMIN ANALYTICS ================= -->
<div class="grid">
  <div class="card analytics">
    <div>🧑‍⚖️ Admin Actions (24h)</div>
    <div class="stat" id="adminActions24h">–</div>
  </div>

  <div class="card analytics">
    <div>🔁 Total Admin Actions</div>
    <div class="stat" id="adminActionsTotal">–</div>
  </div>
</div>

<!-- ================= USERS TABLE ================= -->
<div class="card">
  <h2>Users</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>
</div>

<!-- ================= ADMIN AUDIT LOG ================= -->
<div class="card">
  <h2>🧾 Admin Audit Log</h2>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Action</th>
        <th>Target User</th>
        <th>Change</th>
        <th>By</th>
      </tr>
    </thead>
    <tbody id="auditTable">
      <tr><td colspan="5">Loading logs…</td></tr>
    </tbody>
  </table>
</div>

<br />

<button id="logoutBtn">Logout</button>

<!-- ================= SCRIPTS ================= -->
<script type="module" src="./firebase.js"></script>
<script type="module" src="./dashboard.js"></script>

</body>
</html>
